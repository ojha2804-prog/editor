; PASTE into live DAT Report.cfg under [PART] (do not replace [DXF_SHEETMETAL_PART]).
; Part custom property:
;   Name: SM Density
;   Value / Text Expression: "SW-Density@YourPart.sldprt"
;   Evaluated example: 0.00780
;
; Weight/sheet = (L mm / 1000) × (W mm / 1000) × T mm × ρ g/cm³
; 0.00780 g/mm³ → 7.80 g/cm³ → 2.5 × 1.25 × 2 × 7.80 = 48.75 kg

			[[SM_Density
				TYPE = S
				EVALUATION = <SWCP.SM Density>
			]];SM_Density
