Version = 2026.00

(REPORT)
	REPORTPATH = C:\Swood Reports\<YEAR>_<MONTH>\<SW.TITLE>
	PROGRAMSPATH = <REPORTPATH>\programs
	PROGRAMFILE = <SW.TITLE> - <PROG_NAME>
	PROGRAMFILEIFEXIST =  <SW.TITLE> - <PROG_NAME>
	READMESHES = 1
	USESWOODDESIGNDATA = 1
	COMPUTESWOODDESIGN2013DATA = 0
	PROCESS_SWOODCAM_CONDITION = "TRUE"
	PROFILING_REPORTED = 1
	READWEBGLMESHES = 1
	EXPORT_COMMENTS = 0

	;*****************************************
	;**	          CUTTING PATTERN           **
	;*****************************************
	GENERATE_CUTTING_PATTERN_CONDITION = "NOT(REPORT_ISNESTINGPROJECT)"

	; Cutters
	CUTTING_PATTERN_CUTTER_THICKNESS = 5
	CUTTING_PATTERN_HORIZONTAL_CUTTER_THICKNESS = 5

	; Cutting Pattern Trimmings
	; CUTTING_PATTERN_TRIMMIMG_TOP_BOTTOM = 0
	; CUTTING_PATTERN_TRIMMIMG_LEFT_RIGHT = 0
	; Cutting Pattern Paddings
	CUTTING_PATTERN_PADDING_TOP = 20
	CUTTING_PATTERN_PADDING_LEFT = 20
	CUTTING_PATTERN_PADDING_BOTTOM = 20
	CUTTING_PATTERN_PADDING_RIGHT = 20
	CUTTING_PATTERN_UNIT = MM

	;*****************************************
	;**	          SYSTEM REPORT             **
	;*****************************************
	;GENERATE_SYSTEM_REPORT_CONDITION = FALSE
	;CUTTING_PATTERN_FULLCUT_STRATEGY = VC
	;CUTTING_PATTERN_MAX_REVERSALS = 4
	;*****************************************
	;**	           FORMATTING               **
	;*****************************************
	[FORMATINFO]

		;***** LENGTHUNIT
		;Case "MM", "MILLIMETER", "MILLIMETERS"
		;Case "CM", "CENTIMETER", "CENTIMETERS"
		;Case "M", "METER", "METERS"
		;Case "IN", "INCH", "INCHES"
		;Case "FT", "FEET", "FOOT"
		;Case "1/10"
		LENGTHUNIT = MM
		LENGTHFORMAT = 0.0
		NUMBERDECIMALSEPARATOR = .
		ANGLEFORMAT = 0.0


	;LENGTHUNIT = 1/10
	;LENGTHUNITSYMBOL = "tenth"
	;***** ANGLEUNIT
	;Case "DEG", "DEGREE", "DEGREES"
	;Case "RAD", "RADIAN", "RADIANS"
	;*****************************************
	;**	            PROJECT                **
	;*****************************************
	[PROJECT]

		[[VARIABLES

			[[ReportVersion
				TYPE = S
				VALUE = 3.0.0.R15
				EVALUATION = 3.0.0.R15
				DESCRIPTION = Solid Solutions report version
			]];ReportVersion


			[[SwoodManager
				TYPE = B
				EVALUATION = false
			]];SwoodManager


			[[SwoodManagerHost
				TYPE = S
				EVALUATION = localhost
			]];SwoodManagerHost


			[[SwoodManagerPort
				TYPE = I
				EVALUATION = 4000
			]];SwoodManagerPort


			[[SwoodManagerReportsDirectory
				TYPE = S
				EVALUATION = C:\Swood Reports
			]];SwoodManagerReportsDirectory


			[[SwoodDataDirectory
				TYPE = S
				EVALUATION = <APP.USERPATH>
			]];SwoodDataDirectory


			[[CuttingPatternPlus
				TYPE = B
				EVALUATION = true
				DESCRIPTION = Enable CuttingPatternPlus
			]];CuttingPatternPlus


			[[CuttingPatternPlus_paddingTop
				TYPE = D
				EVALUATION = 20
				DESCRIPTION = Top padding
			]];CuttingPatternPlus_paddingTop


			[[CuttingPatternPlus_paddingBottom
				TYPE = D
				EVALUATION = 20
				DESCRIPTION = Bottom padding
			]];CuttingPatternPlus_paddingBottom


			[[CuttingPatternPlus_paddingLeft
				TYPE = D
				EVALUATION = 20
				DESCRIPTION = Left padding
			]];CuttingPatternPlus_paddingLeft


			[[CuttingPatternPlus_paddingRight
				TYPE = D
				EVALUATION = 20
				DESCRIPTION = Right padding
			]];CuttingPatternPlus_paddingRight


			[[CuttingPatternPlus_sawHorizontal
				TYPE = D
				EVALUATION = 5
				DESCRIPTION = Saw horizontal thickness
			]];CuttingPatternPlus_sawHorizontal


			[[CuttingPatternPlus_sawVertical
				TYPE = D
				EVALUATION = 5
				DESCRIPTION = Saw vertical thickness
			]];CuttingPatternPlus_sawVertical


			[[DAY
				TYPE = S
				EVALUATION = EVAL(LEFT("<DATE>",2))
			]];DAY


			[[MONTH
				TYPE = S
				EVALUATION = EVAL(MID("<DATE>",4,2))
			]];MONTH


			[[YEAR
				TYPE = S
				EVALUATION = EVAL(RIGHT("<DATE>",4))
			]];YEAR


			[[SummaryCreatedDate
				TYPE = S
				EVALUATION = <SW.SUMMINFOCREATEDATE>
			]];SummaryCreatedDate


			[[SummarySavedDate
				TYPE = S
				EVALUATION = <SW.SUMMINFOSAVEDATE>
			]];SummarySavedDate


			[[SummarySavedBy
				TYPE = S
				EVALUATION = <SW.SUMMINFOSAVEDBY>
			]];SummarySavedBy


			[[SummaryAuthor
				TYPE = S
				EVALUATION = <SW.SUMMINFOAUTHOR>
			]];SummaryAuthor


			[[SummaryKeywords
				TYPE = S
				EVALUATION = <SW.SUMMINFOKEYWORDS>
			]];SummaryKeywords


			[[SummaryTitle
				TYPE = S
				EVALUATION = <SW.SUMMINFOTITLE>
			]];SummaryTitle


			[[SummarySubject
				TYPE = S
				EVALUATION = <SW.SUMMINFOSUBJECT>
			]];SummarySubject


			[[SummaryComments
				TYPE = S
				EVALUATION = <SW.SUMMINFOCOMMENT>
			]];SummaryComments


			[[SimpleReport
				TYPE = B
				EVALUATION = <SWCP.Simple Report>
			]];SimpleReport


			[[AutoDrawings
				TYPE = B
				EVALUATION = <SWCP.AutoDrawings>
			]];AutoDrawings


			[[PDFProject
				TYPE = B
				EVALUATION = <SWCP.PDFProject>
			]];PDFProject


			[[PDFFrames
				TYPE = B
				EVALUATION = <SWCP.PDFFrames>
			]];PDFFrames


			[[PDFPanels
				TYPE = B
				EVALUATION = <SWCP.PDFPanels>
			]];PDFPanels


			[[PDFHardware
				TYPE = B
				EVALUATION = <SWCP.PDFHardware>
			]];PDFHardware


			[[eDrawingsProject
				TYPE = B
				EVALUATION = TRUE	; <SWCP.eDrawingsProject>
			]];eDrawingsProject


			[[eDrawingsFrames
				TYPE = B
				EVALUATION = <SWCP.eDrawingsFrames>
			]];eDrawingsFrames


			[[eDrawingsSubFrames
				TYPE = B
				EVALUATION = <SWCP.eDrawingsSubFrames>
			]];eDrawingsSubFrames


			[[eDrawingsSheets
				TYPE = B
				EVALUATION = TRUE	; <SWCP.eDrawingsSheets>
			]];eDrawingsSheets


			[[eDrawingsPanels
				TYPE = B
				EVALUATION = <SWCP.eDrawingsPanels>
			]];eDrawingsPanels


			[[eDrawingsHardware
				TYPE = B
				EVALUATION = <SWCP.eDrawingsHardware>
			]];eDrawingsHardware


			[[DXFSheets
				TYPE = B
				EVALUATION = <SWCP.DXFSheets>
			]];DXFSheets


			[[DXFPanels
				TYPE = B
				EVALUATION = <SWCP.DXFPanels>
			]];DXFPanels


			[[PROJNAME	; SYSTEM MODIFIABLE VARIABLE
				TYPE = S
			]];PROJNAME

		]];VARIABLES



	;*****************************************
	;**	             COMPONENT			    **
	;*****************************************
	[COMPONENT]

		[[VARIABLES

			[[COMPCONF	; SYSTEM MODIFIABLE VARIABLE
				TYPE = S
			]];COMPCONF


			[[COMPNAME	; SYSTEM MODIFIABLE VARIABLE
				TYPE = S
			]];COMPNAME

		]];VARIABLES



	;*****************************************
	;**	               PART				    **
	;*****************************************
	[PART]
		CUTTING_PATTERN_IGNOREPART = "Exclude"

		[[VARIABLES

			[[Hardware
				TYPE = S
				EVALUATION = <SWCP.Hardware>
			]];Hardware


			[[Frame
				TYPE = B
				EVALUATION = <SWCP.Frame>
			]];Frame


			[[SubFrame
				TYPE = B
				EVALUATION = <SWCP.SubFrame>
			]];SubFrame


			[[Exclude
				TYPE = B
				EVALUATION = <SWCP.Exclude>
			]];Exclude


			; --- sheet metal ------------------------------------------------
			; A sheet metal part has no multibody stock, so <SWCLP.> cannot see
			; its cut list. Run the CopySheetMetalProps macro once per part to
			; lift the cut-list values into DOCUMENT custom properties; they are
			; then read here with <SWCP.>.
			; TO ADD ONE: copy a block and match the property name the macro writes.

			[[SM_BlankLength
				TYPE = R
				EVALUATION = <SWCP.Bounding Box Length>
			]];SM_BlankLength


			[[SM_BlankWidth
				TYPE = R
				EVALUATION = <SWCP.Bounding Box Width>
			]];SM_BlankWidth


			[[SM_Thickness
				TYPE = R
				EVALUATION = <SWCP.Sheet Metal Thickness>
			]];SM_Thickness


			; Grain direction for brushed / directional sheet. Read by
			; swood-client.js as SM_Grain: Length locks nesting rotations to
			; 0/180, Width to 90/270, Any or blank leaves all four free.
			; Set it on the part in the Custom Properties tab.
			[[SM_Grain
				TYPE = S
				EVALUATION = <SWCP.Grain Direction>
			]];SM_Grain


			[[SM_Gauge
				TYPE = S
				EVALUATION = <SWCP.Sheet Metal Gauge>
			]];SM_Gauge


			[[SM_BlankArea
				TYPE = R
				EVALUATION = <SWCP.Bounding Box Area-Blank>
			]];SM_BlankArea


			[[SM_BBoxArea
				TYPE = R
				EVALUATION = <SWCP.Bounding Box Area>
			]];SM_BBoxArea


			[[SM_CutLengthOuter
				TYPE = R
				EVALUATION = <SWCP.Cutting Length-Outer>
			]];SM_CutLengthOuter


			[[SM_CutLengthInner
				TYPE = R
				EVALUATION = <SWCP.Cutting Length-Inner>
			]];SM_CutLengthInner


			[[SM_CutOuts
				TYPE = I
				EVALUATION = <SWCP.Cut Outs>
			]];SM_CutOuts


			[[SM_Bends
				TYPE = I
				EVALUATION = <SWCP.Bends>
			]];SM_Bends


			[[SM_BendRadius
				TYPE = R
				EVALUATION = <SWCP.Bend Radius>
			]];SM_BendRadius


			[[SM_Mass
				TYPE = R
				EVALUATION = <SWCP.Mass>
			]];SM_Mass


			; File Properties name: SM Density
			; Value / Text Expression: "SW-Density@ThisPart.sldprt"
			; Evaluated: 0.00780 (g/mm³). Client converts to g/cm³ for
			; Weight/sheet = (L/1000)×(W/1000)×T×ρ
			[[SM_Density
				TYPE = S
				EVALUATION = <SWCP.SM Density>
			]];SM_Density


			[[SM_SWDensity
				TYPE = S
				EVALUATION = <SWCP.SW-Density>
			]];SM_SWDensity


			[[SM_MaterialDensity
				TYPE = R
				EVALUATION = <SWCP.SW-Material Density>
			]];SM_MaterialDensity


			[[SM_Material
				TYPE = S
				EVALUATION = <SWCP.SM Material>
			]];SM_Material


			; --- finish, read from the part's custom properties -------------
			; Set by the Property Tab Builder dropdowns. Same names as the
			; weldment cut-list version, so swood-client.js finds either.

			[[SMX_SurfaceFinish
				TYPE = S
				EVALUATION = <SWCP.Surface Finish>
			]];SMX_SurfaceFinish


			[[SMX_RALColour
				TYPE = S
				EVALUATION = <SWCP.RAL Colour>
			]];SMX_RALColour


			[[SMX_CoatSides
				TYPE = R
				EVALUATION = <SWCP.Coat Sides>
			]];SMX_CoatSides


			[[DESC	; SYSTEM MODIFIABLE VARIABLE
				TYPE = S
			]];DESC


			[[NAME	; SYSTEM MODIFIABLE VARIABLE
				TYPE = S
			]];NAME

		]];VARIABLES



	;*****************************************
	;**				ASSEMBLY			    **
	;*****************************************
	[ASSEMBLY]

		[[VARIABLES

			[[Hardware
				TYPE = S
				EVALUATION = <SWCP.Hardware>
			]];Hardware


			[[Frame
				TYPE = B
				EVALUATION = <SWCP.Frame>
			]];Frame


			[[SubFrame
				TYPE = B
				EVALUATION = <SWCP.SubFrame>
			]];SubFrame


			[[Exclude
				TYPE = B
				EVALUATION = <SWCP.Exclude>
			]];Exclude


			[[Location
				TYPE = B
				EVALUATION = <SWCP.Location>
			]];Location


			; Per-product multiplier, so the Frames and Sub Frames pages can show
			; a real total.
			;
			; The frame row carries "quantity" = the PROJECT quantity (10 on
			; Assem1). The multiplier lives in the custom property
			; "Product Quantity" - 3 on DOWN_CABINET_ONE_PROD_Assem1_3, whose
			; sub-frames correctly read 30.
			;
			; view-settings.js cannot reach it directly: field expressions use dot
			; notation (swcps.Description, swcps.ID) and "Product Quantity" has a
			; space in it. Nothing space-free on the assembly holds the same value
			; - BOMQTY is 90, PRODUCT_QTY is 50, "Project Quantity" is 0. Hence
			; this alias, which the column then reads as variables.PRODQTY.
			[[PRODQTY
				TYPE = R
				EVALUATION = <SWCP.Product Quantity>
			]];PRODQTY


			[[MASS
				TYPE = R
				EVALUATION = <SW.MASS>
			]];MASS


			[[DESC	; SYSTEM MODIFIABLE VARIABLE
				TYPE = S
			]];DESC


			[[NAME	; SYSTEM MODIFIABLE VARIABLE
				TYPE = S
			]];NAME

		]];VARIABLES



	;*****************************************
	;**	            MULTIBODY			    **
	;*****************************************
	[MULTIBODYSTOCK]

		[[VARIABLES

			[[MBS_Cutlist
				TYPE = S
				EVALUATION = <SWCL.NAME>
			]];MBS_Cutlist


			[[MBS_Material
				TYPE = S
				EVALUATION = <SWCLP.MATERIAL>
			]];MBS_Material


			[[MBS_Quantity
				TYPE = I
				EVALUATION = <SWCLP.QUANTITY>
			]];MBS_Quantity


			[[MBS_Description
				TYPE = S
				EVALUATION = <SWCLP.DESCRIPTION>
			]];MBS_Description


			[[MBS_Length
				TYPE = D
				EVALUATION = <SWCLP.LENGTH>
			]];MBS_Length


			[[MBS_TotalLength
				TYPE = R
				EVALUATION = <SWCLP.TOTAL LENGTH>
			]];MBS_TotalLength


			[[MBS_Angle1
				TYPE = S
				EVALUATION = <SWCLP.ANGLE1>
			]];MBS_Angle1


			[[MBS_Angle2
				TYPE = S
				EVALUATION = <SWCLP.ANGLE2>
			]];MBS_Angle2


			;---------------------------------------------------------------
			; CUT-LIST PROPERTIES  (added)
			; <SWCLP.xxx> = a SolidWorks Cut-List property name, exactly as it
			; appears in Cut-List Properties. TYPE: S=text I=int R=real D=dim.
			; TO ADD ANOTHER: copy one block, change the name and the SWCLP key,
			; then add a column in swood-client.js WELDMENT_CUTLIST_COLUMNS.
			;---------------------------------------------------------------

			;---------------------------------------------------------------
			; SHEET METAL  (added)
			; A sheet metal part carries a cut list too, so its properties come
			; through <SWCLP.xxx> exactly like a weldment's. Names match the
			; Cut-List Properties dialog. TO ADD ONE: copy a block.
			;---------------------------------------------------------------

			[[SM_BlankLength
				TYPE = R
				EVALUATION = <SWCLP.Bounding Box Length>
			]];SM_BlankLength


			[[SM_BlankWidth
				TYPE = R
				EVALUATION = <SWCLP.Bounding Box Width>
			]];SM_BlankWidth


			[[SM_Thickness
				TYPE = R
				EVALUATION = <SWCLP.Sheet Metal Thickness>
			]];SM_Thickness


			[[SM_Gauge
				TYPE = S
				EVALUATION = <SWCLP.Sheet Metal Gauge>
			]];SM_Gauge


			; net blank area - already excludes corner notches and cut-outs
			[[SM_BlankArea
				TYPE = R
				EVALUATION = <SWCLP.Bounding Box Area-Blank>
			]];SM_BlankArea


			[[SM_BBoxArea
				TYPE = R
				EVALUATION = <SWCLP.Bounding Box Area>
			]];SM_BBoxArea


			[[SM_CutLengthOuter
				TYPE = R
				EVALUATION = <SWCLP.Cutting Length-Outer>
			]];SM_CutLengthOuter


			[[SM_CutLengthInner
				TYPE = R
				EVALUATION = <SWCLP.Cutting Length-Inner>
			]];SM_CutLengthInner


			[[SM_CutOuts
				TYPE = I
				EVALUATION = <SWCLP.Cut Outs>
			]];SM_CutOuts


			[[SM_Bends
				TYPE = I
				EVALUATION = <SWCLP.Bends>
			]];SM_Bends


			[[SM_BendRadius
				TYPE = R
				EVALUATION = <SWCLP.Bend Radius>
			]];SM_BendRadius


			[[SM_BendAllowance
				TYPE = R
				EVALUATION = <SWCLP.Bend Allowance>
			]];SM_BendAllowance


			[[SM_Material
				TYPE = S
				EVALUATION = <SWCLP.MATERIAL>
			]];SM_Material


			[[SM_Mass
				TYPE = R
				EVALUATION = <SWCLP.Mass>
			]];SM_Mass


			[[SM_Density
				TYPE = S
				EVALUATION = <SWCLP.SM Density>
			]];SM_Density


			[[SM_MaterialDensity
				TYPE = R
				EVALUATION = <SWCLP.SW-Material Density>
			]];SM_MaterialDensity


			[[SM_Quantity
				TYPE = I
				EVALUATION = <SWCLP.QUANTITY>
			]];SM_Quantity


			[[SM_SurfaceTreatment
				TYPE = S
				EVALUATION = <SWCLP.Surface Treatment>
			]];SM_SurfaceTreatment


			[[SM_Description
				TYPE = S
				EVALUATION = <SWCLP.Description>
			]];SM_Description


			; --- surface treatment / coating -------------------------------
			; Put the process name (RED OXIDE, POWDERCOAT, PVD, RAL 6000 ...)
			; in ONE of these cut-list properties. swood-client.js reads them in
			; the order listed in CONFIG.coating.processProperties.

			[[MBS_Process
				TYPE = S
				EVALUATION = <SWCLP.Process>
			]];MBS_Process


			[[MBS_Finish
				TYPE = S
				EVALUATION = <SWCLP.Surface Finish>
			]];MBS_Finish


			[[MBS_RALColour
				TYPE = S
				EVALUATION = <SWCLP.RAL Colour>
			]];MBS_RALColour


			[[MBS_Coating
				TYPE = S
				EVALUATION = <SWCLP.Coating>
			]];MBS_Coating


			; coated sides override, per body. blank = use CONFIG rule
			[[MBS_CoatSides
				TYPE = R
				EVALUATION = <SWCLP.Coat Sides>
			]];MBS_CoatSides


			[[MBS_AngleDirection
				TYPE = S
				EVALUATION = <SWCLP.Angle Direction>
			]];MBS_AngleDirection


			[[MBS_AngleRotation
				TYPE = S
				EVALUATION = <SWCLP.Angle Rotation>
			]];MBS_AngleRotation


			[[MBS_Weight
				TYPE = R
				EVALUATION = <SWCLP.Weight>
			]];MBS_Weight


			[[MBS_CutlistDesc
				TYPE = S
				EVALUATION = <SWCL.DESCRIPTION>
			]];MBS_CutlistDesc


			[[MBS_BB_Length
				TYPE = R
				EVALUATION = <SWCLP.3D-Bounding Box Length>
			]];MBS_BB_Length


			[[MBS_BB_Width
				TYPE = R
				EVALUATION = <SWCLP.3D-Bounding Box Width>
			]];MBS_BB_Width


			[[MBS_BB_Thickness
				TYPE = R
				EVALUATION = <SWCLP.3D-Bounding Box Thickness>
			]];MBS_BB_Thickness


			[[MBS_BB_Volume
				TYPE = R
				EVALUATION = <SWCLP.3D-Bounding Box Volume>
			]];MBS_BB_Volume

		]];VARIABLES



	;*****************************************
	;**	             PANEL	            	**
	;*****************************************
	[PANEL]

		[[VARIABLES
		]];VARIABLES



	;*****************************************
	;**	             PROGRAM            	**
	;*****************************************
	[PROGRAM]
		UPDATE_DEBIT_WITH_FIRST_PROGRAM_DATA = 0	; Prioritise the first program data for image generation

		[[VARIABLES

			[[PROG_COMMENT
				TYPE = S
				EVALUATION = <DOC.COMMENT>
				DESCRIPTION = Property required to obtain the comment of the program document
			]];PROG_COMMENT

		]];VARIABLES



	[PROGRAMPART]

		[[VARIABLES
		]];VARIABLES



	;*****************************************
	;**	             DEBIT				    **
	;*****************************************
	[DEBIT]
		PROGDATA_INDEBIT_SUFFIX = <PROGID>


	;*****************************************
	;**	           OBJECT TYPE			    **
	;*****************************************
	[TYPEDOBJECT]
		OBJECTVARIABLEFORMAT = TO_{0}

		[[EXCLUDED
			DESCRIPTION = Exclude
			CHECKPART = 1
			ISPART = (Exclude)
			IGNOREPART = FALSE
			CHECKASSEMBLY = 1
			ISASSEMBLY = (Exclude)
			IGNOREASSEMBLY = FALSE
			ASSEMBLYPROCESSCHILD = 0
			ASSEMBLYREADMESHES = 1
			ISDEBITSCIEPART = FALSE

			[[VARIABLES
			]];VARIABLES

		]];EXCLUDED


		[[FRAME
			DESCRIPTION = Frame
			CHECKPART = 1
			ISPART = Frame
			IGNOREPART = FALSE
			CHECKASSEMBLY = 1
			ISASSEMBLY = Frame
			IGNOREASSEMBLY = FALSE
			ASSEMBLYPROCESSCHILD = 0
			ASSEMBLYREADMESHES = 0
			ISDEBITSCIEPART = FALSE
			PROPAGATEVARIABLEONPART = 1
			PROPAGATEVARIABLEONASSEMBLY = 1

			[[VARIABLES
			]];VARIABLES

		]];FRAME


		[[HARDWARE
			DESCRIPTION = Hardware
			CHECKPART = 1
			ISPART = (((UCASE(Hardware) = 'YES') OR (PATH CONTAINS "\Hardwares\") OR (UCASE(PATH) CONTAINS "\SOLIDWORKS DATA")) AND NOT(UCASE(Hardware) = 'NO'))
			IGNOREPART = FALSE
			CHECKASSEMBLY = 1
			ISASSEMBLY = (((UCASE(Hardware) = 'YES') OR (PATH CONTAINS "\Hardwares\") OR (UCASE(PATH) CONTAINS "\SOLIDWORKS DATA")) AND NOT(UCASE(Hardware) = 'NO'))
			IGNOREASSEMBLY = FALSE
			ASSEMBLYPROCESSCHILD = 0
			ASSEMBLYREADMESHES = 1
			ISDEBITSCIEPART = FALSE

			[[VARIABLES
			]];VARIABLES

		]];HARDWARE


		[[SHEETMETAL
			; A part is sheet metal when CopySheetMetalProps has given it a real
			; thickness. Defined here so PROCESSON = TYPEDOBJECT / TOTYPE =
			; SHEETMETAL becomes available, the same way HARDWARE and FRAME are.
			; IGNOREPART = FALSE keeps the parts in the parts collection, so the
			; Sheetmetal pages are unaffected.
			DESCRIPTION = Sheet metal
			CHECKPART = 1
			ISPART = (SM_Thickness > 0)
			IGNOREPART = FALSE
			CHECKASSEMBLY = 0
			IGNOREASSEMBLY = TRUE
			ASSEMBLYPROCESSCHILD = 0
			ASSEMBLYREADMESHES = 1
			ISDEBITSCIEPART = FALSE

			[[VARIABLES
			]];VARIABLES

		]];SHEETMETAL


		[[LOCATION
