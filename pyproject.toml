[project]
name = "maxcut-optimiser"
version = "0.3.0"
description = "Panel cutting layout optimiser and graph Max-Cut solvers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
spectral = ["numpy>=1.24"]
dev = ["numpy>=1.24", "pytest>=7.0"]

[project.scripts]
cutlayout = "cutlayout.cli:main"
maxcut = "maxcut.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxcut*", "cutlayout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
