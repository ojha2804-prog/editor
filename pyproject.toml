[project]
name = "maxcut-optimiser"
version = "0.2.0"
description = "Heuristic optimiser for the weighted Max-Cut problem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
spectral = ["numpy>=1.24"]
dev = ["numpy>=1.24", "pytest>=7.0"]

[project.scripts]
maxcut = "maxcut.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
